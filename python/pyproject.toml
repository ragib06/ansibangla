[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ansibangla"
version = "1.0.0"
description = "Convert ANSI Bangla (Bijoy / SutonnyMJ) PDFs and Word documents to Unicode, keeping their formatting: PDF, Word, EPUB, Markdown and printable HTML."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ragib Ahsan" }]
requires-python = ">=3.9"
dependencies = ["pymupdf>=1.24.3,<2"]  # 2.x pulls in ~200 MB of AI layout packages this tool does not use
keywords = ["bengali", "bangla", "ansi", "sutonnymj", "bijoy", "unicode", "pdf", "docx", "epub", "converter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Bengali",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Fonts",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://ansibangla.cc/"

[project.scripts]
ansibangla = "ansibangla.cli:main"

[tool.setuptools.packages.find]
include = ["ansibangla*"]

[tool.setuptools.package-data]
ansibangla = ["fonts/*.ttf", "fonts/OFL.txt"]
